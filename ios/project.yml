# Generate the Xcode project with:  xcodegen generate   (brew install xcodegen)
name: FamilyHub
options:
  bundleIdPrefix: com.amcgrean
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  FamilyHub:
    type: application
    platform: iOS
    sources:
      - path: FamilyHub
        excludes:
          - "**/*.example.plist"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amcgrean.familyhub
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""            # <- paste your Apple Team ID here (or pick it in Xcode)
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: FamilyHub/Info.plist
      properties:
        CFBundleDisplayName: Family Hub
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Scan grocery barcodes to add them to the family list.
        UIAppFonts:
          - JosefinSans_400Regular.ttf
          - JosefinSans_600SemiBold.ttf
          - JosefinSans_700Bold.ttf
          - Pacifico_400Regular.ttf
    entitlements:
      path: FamilyHub/FamilyHub.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
